<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI终端 · 图标方案</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",sans-serif;color-scheme:light;--page:#f5f6f8;--surface:#fff;--ink:#20272f;--muted:#69747f;--line:#dfe4e8;--accent:#167b69;--wash:#eaf5f1}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink)}body.dark{color-scheme:dark;--page:#111519;--surface:#1a2026;--ink:#eef2f5;--muted:#a5afb9;--line:#343d46;--accent:#80d8be;--wash:#223b33}main{max-width:1184px;margin:auto;padding:36px 32px 40px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:28px;line-height:1.4;margin:0;letter-spacing:.2px}p{font-size:15px;line-height:1.7;color:var(--muted);margin:10px 0 0}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.plain{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;min-height:44px;padding:10px 16px;text-decoration:none;font-size:14px;display:inline-flex;align-items:center;justify-content:center}.concepts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:28px}.concept{position:relative;text-align:left;display:flex;flex-direction:column;align-items:flex-start;padding:22px;border:1px solid var(--line);border-radius:16px;color:var(--ink);background:var(--surface);min-height:260px;transition:box-shadow .12s,border-color .12s}.concept:hover{border-color:var(--accent)}.concept[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}.large{width:100%;display:flex;justify-content:center;margin:4px 0 21px}.large svg{width:104px;height:104px}.name{font-size:17px;font-weight:600;line-height:1.5}.description{font-size:14px;line-height:1.7;color:var(--muted);margin-top:7px}.choice{position:absolute;top:14px;right:14px;width:20px;height:20px;border:1px solid var(--line);border-radius:50%}.concept[aria-checked="true"] .choice{background:var(--accent);border-color:var(--accent)}.concept[aria-checked="true"] .choice:after{content:"";position:absolute;left:6px;top:3px;width:5px;height:9px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg)}.section-title{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:30px 0 14px}h2{font-size:20px;line-height:1.5;margin:0}.selection{font-size:14px;color:var(--muted)}.previews{display:grid;grid-template-columns:1fr 1fr;gap:16px}.preview{border:1px solid #dfe4e8;border-radius:14px;background:#fff;color:#596571;padding:18px 22px}.preview.night{background:#171c23;color:#a8b1bc;border-color:#2d3540}.preview-title{font-size:13px;margin-bottom:19px}.sizes{height:88px;display:flex;align-items:flex-end;justify-content:space-around;gap:16px}.sample{display:flex;align-items:center;flex-direction:column;gap:10px;min-width:34px}.sample svg{width:var(--size);height:var(--size);display:block}.sample span{font-size:12px;line-height:16px}.footer-panel{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px}.feedback-top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px}label{font-size:16px;font-weight:600}textarea{font:inherit;font-size:14px;line-height:1.6;background:var(--page);color:var(--ink);resize:vertical;border:1px solid var(--line);border-radius:9px;min-height:72px;width:100%;padding:10px 12px;display:block}.actions{margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}.status{font-size:13px;color:var(--muted)}.hint{font-size:13px;margin-top:18px}.hint strong{color:var(--ink);font-weight:500}@media(max-width:920px){.concepts{grid-template-columns:repeat(2,minmax(0,1fr))}.concept{min-height:240px}}@media(max-width:600px){main{padding:24px 18px}h1{font-size:24px}header{align-items:flex-start}.concepts,.previews{grid-template-columns:1fr}.concept{min-height:225px}.sizes{gap:8px}.section-title{align-items:flex-start;flex-direction:column;gap:4px}}@media(prefers-reduced-motion:reduce){.concept{transition:none}}
</style></head><body><main><header><h1>AI终端 · 图标方案</h1><button class="plain" id="theme" type="button" aria-pressed="false">深色预览</button></header><p>已采用 B · 会话叠窗。其余方案保留作对照，可继续查看不同尺寸与背景效果。</p>
<div class="concepts" role="radiogroup" aria-label="图标方案" id="concepts"></div>
<div class="section-title"><h2>不同尺寸的效果</h2><span class="selection" id="selection"></span></div><div class="previews"><div class="preview"><div class="preview-title">浅色背景</div><div class="sizes" id="light"></div></div><div class="preview night"><div class="preview-title">深色背景</div><div class="sizes" id="night"></div></div></div>
<section class="footer-panel"><div class="feedback-top"><label for="notes">你的意见</label><a class="plain" id="download" download>下载这个 SVG</a></div><textarea id="notes" placeholder="例如：选 B，颜色改成薄荷绿；或者保留 A 的光标，再加一点多会话的感觉。"></textarea><div class="actions"><button type="button" id="copy" class="plain primary">复制选择与意见</button><span class="status" id="status" role="status">复制后发给我，或直接在对话中说方案编号。</span></div></section><p class="hint"><strong>我的倾向：</strong>A 更直接、耐看；B 更能表达多会话管理。B · 会话叠窗已选定并应用为程序图标。</p></main>
<script>
const concepts=[{"id": "a", "name": "命令光标", "description": "石墨黑与薄荷绿，直接、克制，终端辨识度高。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 128 128\" role=\"img\" aria-label=\"命令光标\"><rect x=\"4\" y=\"4\" width=\"120\" height=\"120\" rx=\"28\" fill=\"#141a22\"/><path d=\"M34 45 53 64 34 83\" fill=\"none\" stroke=\"#eef3f8\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M66 83h28\" stroke=\"#77d9bd\" stroke-width=\"8\" stroke-linecap=\"round\"/></svg>"}, {"id": "b", "name": "会话叠窗", "description": "两层窗口表达多会话，带一点安静的紫色。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 128 128\" role=\"img\" aria-label=\"会话叠窗\"><rect x=\"4\" y=\"4\" width=\"120\" height=\"120\" rx=\"28\" fill=\"#181822\"/><rect x=\"27\" y=\"29\" width=\"66\" height=\"53\" rx=\"10\" fill=\"none\" stroke=\"#a79be7\" stroke-width=\"6\"/><rect x=\"39\" y=\"45\" width=\"66\" height=\"53\" rx=\"10\" fill=\"#181822\" stroke=\"#eeedf6\" stroke-width=\"6\"/><path d=\"m52 60 11 11-11 11\" fill=\"none\" stroke=\"#eeedf6\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M77 82h13\" stroke=\"#a79be7\" stroke-width=\"6\" stroke-linecap=\"round\"/></svg>"}, {"id": "c", "name": "聚焦工作区", "description": "括号与光标组成一个工作区，轻盈、清晰。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 128 128\" role=\"img\" aria-label=\"聚焦工作区\"><rect x=\"4\" y=\"4\" width=\"120\" height=\"120\" rx=\"28\" fill=\"#edf4f2\"/><path d=\"M36 42H26v44h10M92 42h10v44H92\" fill=\"none\" stroke=\"#263c3e\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"54\" y=\"47\" width=\"20\" height=\"34\" rx=\"3\" fill=\"#188977\"/></svg>"}, {"id": "d", "name": "AI 字母标", "description": "蓝色底与几何字母，识别直接、更加醒目。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 128 128\" role=\"img\" aria-label=\"AI 字母标\"><rect x=\"4\" y=\"4\" width=\"120\" height=\"120\" rx=\"28\" fill=\"#5267d5\"/><path d=\"m26 88 22-49 22 49M35 69h26M93 41v47\" fill=\"none\" stroke=\"#f6f8ff\" stroke-width=\"7.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>"}];let selected='a';const area=document.querySelector('#concepts');
function select(id){selected=id;const c=concepts.find(c=>c.id===id);document.querySelectorAll('.concept').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.id===id)));document.querySelector('#selection').textContent='当前：'+id.toUpperCase()+' · '+c.name;for(const target of ['light','night']){const el=document.querySelector('#'+target);el.replaceChildren();for(const size of [16,24,32,64]){const sample=document.createElement('div');sample.className='sample';sample.style.setProperty('--size',size+'px');sample.innerHTML=c.svg+'<span>'+size+' px</span>';el.append(sample);}}const link=document.querySelector('#download');link.href=id+'.svg';link.download='ai-terminal-'+id+'.svg';try{localStorage.setItem('ai-terminal-icon-choice',id);}catch{}document.querySelector('#status').textContent='复制后发给我，或直接在对话中说方案编号。';}
for(const c of concepts){const b=document.createElement('button');b.type='button';b.className='concept';b.dataset.id=c.id;b.setAttribute('role','radio');b.setAttribute('aria-checked','false');b.innerHTML='<span class="choice" aria-hidden="true"></span><span class="large">'+c.svg+'</span><span class="name">'+c.id.toUpperCase()+' · '+c.name+'</span><span class="description">'+c.description+'</span>';b.addEventListener('click',()=>select(c.id));b.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();const offset=['ArrowRight','ArrowDown'].includes(e.key)?1:-1;const index=(concepts.findIndex(c=>c.id===selected)+offset+concepts.length)%concepts.length;select(concepts[index].id);area.children[index].focus();}});area.append(b);}
let stored='b';try{stored='b';document.querySelector('#notes').value=localStorage.getItem('ai-terminal-icon-notes')||'';}catch{}select(concepts.some(c=>c.id===stored)?stored:'a');document.querySelector('#notes').addEventListener('input',e=>{try{localStorage.setItem('ai-terminal-icon-notes',e.target.value);}catch{}});
document.querySelector('#theme').addEventListener('click',e=>{const dark=document.body.classList.toggle('dark');e.target.textContent=dark?'浅色预览':'深色预览';e.target.setAttribute('aria-pressed',String(dark));});
document.querySelector('#copy').addEventListener('click',async()=>{const c=concepts.find(c=>c.id===selected);const notes=document.querySelector('#notes').value.trim();const text='我选择图标方案 '+selected.toUpperCase()+'（'+c.name+'）'+(notes?'。修改意见：'+notes:'。');try{await navigator.clipboard.writeText(text);document.querySelector('#status').textContent='已复制，可以粘贴到我们的对话中。';}catch{document.querySelector('#notes').value=text;document.querySelector('#notes').select();document.querySelector('#status').textContent='请按 Ctrl+C 复制已选中的内容。';}});
if(new URLSearchParams(location.search).has('verify')){select('b');const a=document.querySelector('#download').getAttribute('href')==='b.svg'&&document.querySelectorAll('[aria-checked="true"]').length===1&&document.querySelectorAll('.sample svg').length===8;document.querySelector('#theme').click();const b=document.body.classList.contains('dark');select('a');document.documentElement.dataset.verified=String(a&&b);}
</script></body></html>
