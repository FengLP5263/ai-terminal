[package]
name = "ai-terminal"
version = "0.1.2"
edition = "2024"
rust-version = "1.92"
description = "A small native workspace for coding-agent terminals"
license = "MIT"
default-run = "ai-terminal"

[workspace]
members = ["vendor/egui_term"]

[features]
default = ["renderer-glow"]
renderer-glow = ["eframe/glow"]
renderer-wgpu = ["eframe/wgpu_no_default_features", "dep:wgpu"]

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["default_fonts"] }
egui = "0.35"
egui_term = { path = "vendor/egui_term" }
wgpu = { version = "29", optional = true, default-features = false, features = ["dx12", "wgsl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
rfd = { version = "0.15", default-features = false }
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_System_ProcessStatus", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2
