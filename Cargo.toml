[package]
name = "ai-terminal"
version = "0.4.10"
edition = "2024"
rust-version = "1.92"
description = "A small native workspace for coding-agent terminals"
license = "MIT"
default-run = "ai-terminal"

[workspace]
members = ["vendor/egui_term"]
exclude = ["vendor/egui-winit", "vendor/egui_glow", "vendor/winit", "vendor/alacritty_terminal", "vendor/vte"]

[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
egui_glow = { path = "vendor/egui_glow" }
winit = { path = "vendor/winit" }
alacritty_terminal = { path = "vendor/alacritty_terminal" }
vte = { path = "vendor/vte" }

[features]
default = ["renderer-glow"]
renderer-glow = ["eframe/glow"]
renderer-wgpu = ["eframe/wgpu_no_default_features", "dep:wgpu"]

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["default_fonts"] }
egui = "0.35"
egui_term = { path = "vendor/egui_term" }
wgpu = { version = "29", optional = true, default-features = false, features = ["dx12", "wgsl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
png = "0.18"
unicode-segmentation = "1.13.3"
raw-window-handle = "0.6.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Globalization", "Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2
